<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f0e8">
<title>小小理財家｜校園理財冒險</title>
<style>
:root{--ink:#24352f;--muted:#738078;--paper:#fbf9f4;--green:#28634e;--lime:#d8eb91;--orange:#ee9b58;--pink:#f4d6cd;--line:#e9e5db;--shadow:0 12px 35px #344b3910}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}button{font:inherit;cursor:pointer}header{max-width:1180px;margin:auto;padding:24px 28px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:19px;display:flex;align-items:center;gap:10px}.brand-icon{background:var(--lime);width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:21px}.day-pill{background:white;border:1px solid var(--line);border-radius:99px;padding:9px 15px;color:var(--muted);font-size:13px}.wrap{max-width:1180px;margin:auto;padding:12px 28px 54px}.hero{background:#eaf0df;border-radius:28px;padding:36px 42px;display:flex;justify-content:space-between;align-items:center;position:relative;overflow:hidden}.hero:after{content:'🌱';position:absolute;right:8%;font-size:120px;opacity:.17;transform:rotate(-14deg)}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--green);font-weight:800}.hero h1{font-size:clamp(29px,4vw,44px);margin:10px 0 7px;letter-spacing:-1.5px}.hero p{color:#65776b;margin:0;font-size:15px}.hero-stats{display:flex;gap:12px;z-index:1}.stat{background:#ffffffc9;padding:15px 20px;border-radius:18px;min-width:125px}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:24px;margin-top:4px}.stat strong span{font-size:13px}.layout{display:grid;grid-template-columns:1fr 310px;gap:22px;margin-top:23px}.maincol{min-width:0}.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 14px}.tab{border:1px solid var(--line);border-radius:13px;padding:11px 16px;background:white;color:#718077;white-space:nowrap;font-weight:700;font-size:13px}.tab.active{background:var(--green);border-color:var(--green);color:white}.panel{background:white;border:1px solid var(--line);border-radius:23px;padding:25px;box-shadow:var(--shadow);min-height:440px}.panel-head{display:flex;align-items:start;justify-content:space-between;gap:12px;margin-bottom:20px}.panel h2{font-size:21px;margin:0 0 5px}.sub{color:var(--muted);font-size:13px;margin:0}.badge{background:#f0f4e5;color:var(--green);padding:7px 11px;border-radius:99px;font-size:11px;font-weight:800;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid var(--line);border-radius:17px;padding:16px;position:relative;background:#fff}.emoji{font-size:27px}.card h3{font-size:15px;margin:8px 0 3px}.tiny{color:var(--muted);font-size:12px}.price{font-weight:850;margin-top:9px}.inputs{display:flex;gap:9px;align-items:center;margin-top:11px;flex-wrap:wrap}.inputs label{font-size:11px;color:var(--muted)}input{width:69px;border:1px solid var(--line);border-radius:9px;padding:8px;color:var(--ink);font-weight:700}.btn{border:0;border-radius:11px;background:var(--green);color:white;padding:11px 16px;font-weight:800;font-size:13px}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn.light{background:#edf2e5;color:var(--green)}.btn.orange{background:#ed9b59;color:#412d1e}.btn.small{padding:8px 11px;font-size:12px}.section-foot{border-top:1px solid var(--line);margin-top:21px;padding-top:17px;display:flex;justify-content:space-between;align-items:center;gap:12px}.note{border-radius:13px;padding:12px 14px;background:#f6f4ed;color:#69766e;font-size:12px;line-height:1.6}.product-line{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:12px 0}.product-line:last-child{border:0}.product-icon{width:44px;height:44px;border-radius:13px;background:#f4f1e9;display:grid;place-items:center;font-size:24px}.product-desc{flex:1}.product-line h3{margin:0 0 3px;font-size:14px}.need{font-size:10px;color:#668050;background:#eff4e6;border-radius:30px;padding:4px 8px;margin-left:6px}.want{color:#a87543;background:#fbf0e3}.qty{display:flex;align-items:center;gap:8px}.qty button{border:1px solid var(--line);background:white;border-radius:8px;width:27px;height:27px;color:var(--green);font-weight:800}.aside{display:flex;flex-direction:column;gap:15px}.sidecard{background:white;border:1px solid var(--line);border-radius:21px;padding:20px;box-shadow:var(--shadow)}.sidecard h3{font-size:14px;margin:0 0 13px}.moneyrow{display:flex;justify-content:space-between;margin:10px 0;color:#69766e;font-size:13px}.moneyrow strong{color:var(--ink)}.moneyrow.total{border-top:1px solid var(--line);padding-top:12px;color:var(--ink);font-weight:800}.progress{height:8px;background:#edf0e9;border-radius:8px;overflow:hidden;margin:9px 0 5px}.progress i{display:block;height:100%;width:0;background:var(--green);border-radius:8px;transition:.3s}.flow{display:flex;flex-direction:column;gap:11px}.flowrow{display:flex;align-items:center;gap:9px;font-size:12px}.flowicon{width:27px;height:27px;border-radius:9px;background:#f2f4eb;display:grid;place-items:center}.flowrow span:nth-child(2){flex:1;color:#69766e}.flowrow strong{font-size:12px}.tip{background:#f6efd9;border:1px solid #eee5c8;border-radius:18px;padding:16px;font-size:12px;line-height:1.7;color:#6f6246}.tip b{display:block;color:#4b4938;margin-bottom:4px}.empty{padding:30px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:23px;left:50%;transform:translate(-50%,20px);opacity:0;background:#263a30;color:white;padding:12px 19px;border-radius:13px;transition:.25s;pointer-events:none;z-index:4;font-size:13px;box-shadow:0 8px 24px #1113}.toast.show{opacity:1;transform:translate(-50%,0)}.overlay{position:fixed;inset:0;background:#1e2b2480;display:grid;place-items:center;padding:20px;z-index:5}.modal{background:var(--paper);max-width:520px;width:100%;border-radius:26px;padding:32px;text-align:center}.modal .big{font-size:55px}.modal h2{margin:10px 0}.modal p{line-height:1.8;color:#647169}.modal .btn{margin-top:12px}.hidden{display:none!important}.muted{color:var(--muted)}@media(max-width:850px){.layout{grid-template-columns:1fr}.aside{display:grid;grid-template-columns:1fr 1fr}.hero{padding:28px}.hero:after{right:3%}}@media(max-width:560px){header{padding:17px}.wrap{padding:5px 15px 35px}.hero{display:block;padding:25px 22px}.hero-stats{margin-top:20px}.stat{min-width:0;flex:1;padding:12px}.stat strong{font-size:20px}.hero:after{font-size:90px;right:0;top:28px}.grid{grid-template-columns:1fr}.panel{padding:19px}.aside{display:flex}.section-foot{align-items:flex-start;flex-direction:column}.section-foot .btn{width:100%}.tabs{margin-right:-15px}.tab{padding:10px 13px}}
</style></head>
<body><header><div class="brand"><span class="brand-icon">🌿</span>小小理財家</div><div class="day-pill" id="day">📅 第 1 天・校園市集</div></header><main class="wrap"><section class="hero"><div><div class="eyebrow">SCHOOL MARKET · MONEY ADVENTURE</div><h1>今天也來當理財小達人！</h1><p>經營文具店、聰明消費，讓每一塊錢都有好去處。</p></div><div class="hero-stats"><div class="stat"><small>💵 手邊現金</small><strong id="cash">$120</strong></div><div class="stat"><small>🏺 儲蓄罐</small><strong id="savings">$0</strong></div></div></section><div class="layout"><section class="maincol"><nav class="tabs" id="tabs"></nav><div class="panel" id="panel"></div></section><aside class="aside"><section class="sidecard"><h3>🧭 我的資金地圖</h3><div class="moneyrow"><span>💵 手邊現金</span><strong id="cash2">$120</strong></div><div class="moneyrow"><span>🏺 儲蓄罐</span><strong id="save2">$0</strong></div><div class="moneyrow"><span>📈 投資帳戶</span><strong id="invest2">$0</strong></div><div class="moneyrow total"><span>✨ 總資產</span><strong id="total">$120</strong></div><div class="progress"><i id="progress"></i></div><div class="tiny">朝著 $200 資產目標前進</div></section><section class="sidecard"><h3>🔄 今天的現金流</h3><div class="flow" id="flow"></div></section><section class="tip"><b>💡 理財小知識</b><span id="tip">先想想需要什麼，再決定想要什麼。預算有限時，做好選擇很重要！</span></section></aside></div></main><div class="toast" id="toast"></div><div id="modal"></div>
<script>
(()=>{const $=s=>document.querySelector(s), money=n=>'$'+Math.round(n), tabs=[['shop','🏪 文具店'],['spend','🛍️ 消費區'],['save','🏺 儲蓄區'],['invest','📈 投資區']];let s={cash:120,savings:0,invest:0,day:1,tab:'shop',stock:0,cost:0,price:12,sold:0,profit:0,budget:50,cart:{},flow:[],history:[],modal:false};const products=[{id:'pencil',e:'✏️',name:'鉛筆',price:8,need:1},{id:'notebook',e:'📓',name:'筆記本',price:15,need:1},{id:'snack',e:'🍎',name:'水果點心',price:12,need:1},{id:'toy',e:'🪀',name:'跳跳球',price:15,need:0}];function addFlow(icon,label,n){if(n)s.flow.unshift({icon,label,n})}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2300)}function keep(){try{localStorage.setItem('littleMoneyGame',JSON.stringify(s))}catch(e){}}function render(){let asset=s.cash+s.savings+s.invest;$('#cash').textContent=money(s.cash);$('#cash2').textContent=money(s.cash);$('#savings').textContent=money(s.savings);$('#save2').textContent=money(s.savings);$('#invest2').textContent=money(s.invest);$('#total').textContent=money(asset);$('#day').textContent=`📅 第 ${s.day} 天・校園市集`;$('#progress').style.width=Math.min(100,asset/2)+'%';$('#flow').innerHTML=s.flow.length?s.flow.slice(0,5).map(x=>`<div class="flowrow"><span class="flowicon">${x.icon}</span><span>${x.label}</span><strong style="color:${x.n<0?'#c0714c':'#43805a'}">${x.n>0?'+':''}${money(x.n)}</strong></div>`).join(''):'<div class="tiny">完成活動後，資金流向會顯示在這裡。</div>';$('#tabs').innerHTML=tabs.map(([id,label])=>`<button class="tab ${s.tab===id?'active':''}" data-tab="${id}">${label}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{s.tab=b.dataset.tab;render()});$('#panel').innerHTML=views[s.tab]();bind();keep()}
const views={shop:()=>`<div class="panel-head"><div><h2>🏪 我的文具小舖</h2><p class="sub">進貨要花成本，設定售價後賣出商品，看看能不能賺錢！</p></div><span class="badge">收入 − 成本 = 利潤</span></div><div class="grid">${[{e:'✏️',n:'彩虹鉛筆',c:4},{e:'📒',n:'星星筆記本',c:7},{e:'🖍️',n:'蠟筆小盒',c:9}].map((x,i)=>`<article class="card"><div class="emoji">${x.e}</div><h3>${x.n}</h3><div class="tiny">進貨成本 ${money(x.c)}／個</div><div class="inputs"><label>進貨數量</label><input type="number" min="1" max="20" value="${[1,1,1][i]}" id="qty${i}"><label>售價</label><input type="number" min="1" max="99" value="${s.price}" id="price${i}"></div><button class="btn small" style="margin-top:10px" data-buy="${i}" data-cost="${x.c}">進貨並開店</button></article>`).join('')}</div><div class="section-foot"><div class="note">📦 目前庫存 <b>${s.stock}</b> 個　・　累計成本 ${money(s.cost)}<br>賣出時：利潤 = 售價 × 售出數量 − 進貨成本</div><button class="btn orange" id="sell" ${s.stock<1?'disabled':''}>🌟 今天收攤，賣出庫存</button></div>${s.history.length?`<div class="note" style="margin-top:14px">${s.history.slice(-3).reverse().map(x=>`📊 ${x}`).join('<br>')}</div>`:''}`,
spend:()=>`<div class="panel-head"><div><h2>🛍️ 消費選擇題</h2><p class="sub">預算 ${money(s.budget)}：買齊三項必需品，再挑一件喜歡的物品。</p></div><span class="badge">想想需要 vs. 想要</span></div>${products.map(p=>`<div class="product-line"><div class="product-icon">${p.e}</div><div class="product-desc"><h3>${p.name}<span class="need ${p.need?'':'want'}">${p.need?'需要':'想要'}</span></h3><span class="tiny">${money(p.price)}／件</span></div><div class="qty"><button data-q="${p.id}" data-d="-1">−</button><b>${s.cart[p.id]||0}</b><button data-q="${p.id}" data-d="1">+</button></div></div>`).join('')}<div class="section-foot"><div><div class="tiny">已選 ${Object.values(s.cart).reduce((a,b)=>a+b,0)} 件　・　結帳金額 <b style="color:var(--ink)">${money(products.reduce((a,p)=>a+p.price*(s.cart[p.id]||0),0))}</b>　・　預算 ${money(s.budget)}</div><div class="tiny" id="needline">必需品：${products.filter(p=>p.need).map(p=>`${p.e} ${s.cart[p.id]||0}/1`).join('　')}</div></div><button class="btn" id="checkout">完成結帳</button></div>`,
save:()=>`<div class="panel-head"><div><h2>🏺 會長大的儲蓄罐</h2><p class="sub">把錢存起來，緊急或需要時也可以領出來。</p></div><span class="badge">存錢是為未來準備</span></div><div style="text-align:center;padding:23px"><div style="font-size:68px">🏺</div><div class="tiny">我的存款</div><div style="font-size:37px;font-weight:900;margin:5px">${money(s.savings)}</div></div><div class="section-foot" style="justify-content:center;gap:12px"><label>金額 <input id="saveamt" type="number" value="10" min="1"></label><button class="btn" id="deposit">存入儲蓄罐</button><button class="btn light" id="withdraw">領出使用</button></div><div class="note" style="margin-top:22px">🌱 小目標：從今天收入中撥一小部分存起來。儲蓄是把現在的錢留給未來的自己。</div>`,
invest:()=>`<div class="panel-head"><div><h2>📈 小小投資體驗</h2><p class="sub">投入一些錢，看看市場變化會讓投資變多或變少。</p></div><span class="badge">可能獲利，也可能虧損</span></div><div style="background:#f4f6ef;border-radius:20px;padding:22px;text-align:center"><div style="font-size:45px">${s.invest?'🌳':'🌱'}</div><div class="tiny">投資帳戶目前價值</div><div style="font-size:32px;font-weight:900;margin:4px">${money(s.invest)}</div><div class="tiny">市場每天會隨機上漲或下跌 20% 以內</div></div><div class="section-foot"><label>投入金額 <input id="investamt" type="number" min="1" value="20"></label><button class="btn" id="investbtn">投入資金</button><button class="btn orange" id="market" ${s.invest<1?'disabled':''}>🎲 模擬市場變化</button><button class="btn light" id="cashout" ${s.invest<1?'disabled':''}>取回投資</button></div><div class="note" style="margin-top:19px">🧠 投資有風險：結果不一定如預期，不要投入全部的錢。這裡的結果是隨機模擬，幫助我們練習面對變化。</div>`};
function bind(){document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let i=+b.dataset.buy,q=Math.max(1,Math.min(20,+$('#qty'+i).value||1)),cost=+b.dataset.cost,price=Math.max(1,+$('#price'+i).value||12),total=q*cost;if(s.cash<total)return toast('現金不夠喔，試試少進一點！');s.cash-=total;s.cost+=total;s.stock+=q;s.price=price;addFlow('📦','文具進貨',-total);toast(`進貨 ${q} 個，花了 ${money(total)}！`);render()});$('#sell').onclick=()=>{if(s.stock<1)return;let qty=s.stock,revenue=qty*s.price,profit=revenue-s.cost;s.cash+=revenue;s.profit+=profit;let soldCost=s.cost;s.stock=0;s.cost=0;s.history.push(`賣出 ${qty} 個：收入 ${money(revenue)} − 成本 ${money(soldCost)} = 利潤 ${money(profit)}`);addFlow('🛒','文具銷售收入',revenue);s.day++;s.tab='shop';tipProfit(profit);toast(profit>=0?`太棒了！這次賺了 ${money(profit)}！`:`這次少賺一些，利潤是 ${money(profit)}。`);render()};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{let id=b.dataset.q,n=(s.cart[id]||0)+(+b.dataset.d);if(n>=0&&n<8){s.cart[id]=n;render()}});$('#checkout').onclick=()=>{let total=products.reduce((a,p)=>a+p.price*(s.cart[p.id]||0),0),needs=products.filter(p=>p.need).every(p=>(s.cart[p.id]||0)>=1),wants=s.cart.toy||0;if(!needs)return toast('先把三項必需品各放進購物籃吧！');if(!wants)return toast('還可以選一件想要的物品喔！');if(total>s.budget)return toast('超出預算了，調整一下購物籃吧！');if(total>s.cash)return toast('手邊現金不足，先去經營文具店賺錢吧！');s.cash-=total;addFlow('🛍️','購買生活用品',-total);s.budget=50;s.cart={};s.day++;s.tab='save';tip('先滿足生活需要，再用剩下的預算選擇想要的物品。花錢之前看看預算，就不容易買超過！');toast(`成功結帳 ${money(total)}，選擇得很棒！`);render()};$('#deposit').onclick=()=>moveSave(1);$('#withdraw').onclick=()=>moveSave(-1);$('#investbtn').onclick=()=>{let n=Math.max(0,+$('#investamt').value||0);if(!n)return toast('輸入想投入的金額');if(n>s.cash)return toast('現金不足，留下生活需要的錢吧！');s.cash-=n;s.invest+=n;addFlow('📈','投入投資',-n);toast(`投入 ${money(n)}。記得投資有風險！`);render()};$('#market').onclick=()=>{let pct=(Math.random()*0.4)-0.2,change=Math.round(s.invest*pct);s.invest=Math.max(0,s.invest+change);s.day++;addFlow(change>=0?'📈':'📉',change>=0?'投資市場上漲':'投資市場下跌',change);tip(change>=0?`市場這次上漲了 ${money(change)}。投資有時會成長，記得結果每次都不一樣。`:`市場這次下跌了 ${money(-change)}。投資可能虧損，分散風險、保留儲蓄很重要。`);toast(change>=0?`市場上漲！增加 ${money(change)}`:`市場下跌！減少 ${money(-change)}`);render()};$('#cashout').onclick=()=>{if(!s.invest)return;let n=s.invest;s.cash+=n;s.invest=0;addFlow('💵','取回投資',n);toast(`取回 ${money(n)}，投資結果已結算。`);render()}}
function moveSave(dir){let n=Math.max(0,+$('#saveamt').value||0);if(!n)return toast('輸入金額喔');if(dir>0){if(n>s.cash)return toast('現金不足，量入為出喔！');s.cash-=n;s.savings+=n;addFlow('🏺','存入儲蓄罐',-n);toast(`存下 ${money(n)}，為未來做準備！`)}else{if(n>s.savings)return toast('儲蓄罐裡沒有這麼多錢喔');s.savings-=n;s.cash+=n;addFlow('🏺','從儲蓄罐領出',n);toast(`領出 ${money(n)}，有計畫地使用儲蓄！`)}render()}let tip=t=>{$('#tip').textContent=t};function tipProfit(p){tip(p>=0?`文具店今天賺到 ${money(p)}！記住：收入 − 成本 = 利潤。控制進貨成本，合理設定售價，是經營小店的秘訣。`:`今天的售價低於成本，利潤是 ${money(p)}。下次可以調整售價或減少進貨，先算清楚再做決定！`)}
try{let old=JSON.parse(localStorage.getItem('littleMoneyGame'));if(old&&typeof old==='object')s={...s,...old}}catch(e){}if(!s.flow)s.flow=[];if(!s.history)s.history=[];if(!s.cart)s.cart={};render();
})();
</script></body></html>
